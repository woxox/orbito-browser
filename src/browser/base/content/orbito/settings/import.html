<!-- Firefox's migration wizard, for the settings page's import dialog. Its
   - strings are Firefox's (the wizard adds them), so the page has no Orbito
   - strings; the settings page drives it. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; img-src chrome: data: moz-icon:; object-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <link rel="stylesheet" href="chrome://browser/skin/orbito/tokens.css" />
    <link rel="stylesheet" href="chrome://browser/content/orbito/settings/import.css" />
    <script src="chrome://global/content/customElements.js"></script>
    <script src="chrome://browser/content/migration/migration-wizard.mjs" type="module"></script>
  </head>
  <body>
    <migration-wizard dialog-mode></migration-wizard>
  </body>
</html>
