<!-- about:orbito-doc, filled in by the OrbitoDoc actors. Nothing outside
   - chrome:// may load here, and no script but the page's own (it has none:
   - the actors wire up its buttons too) may run. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src chrome:; style-src chrome:; style-src-attr 'unsafe-inline'; img-src chrome:; font-src chrome:; form-action 'none'; base-uri 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Document</title>
    <link rel="stylesheet" href="chrome://browser/content/orbito/doc/doc.css" />
    <link rel="localization" href="orbito/pages.ftl" />
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="status" role="status" hidden></p>
      <p id="sources" hidden></p>
      <p id="actions" hidden>
        <button id="save-markdown" data-l10n-id="orbito-doc-save-markdown">Save as Markdown</button>
        <button id="print" data-l10n-id="orbito-doc-save-pdf">Save as PDF</button>
      </p>
      <p id="history" hidden>
        <select id="versions" data-l10n-id="orbito-doc-versions" aria-label="Version"></select>
        <button id="restore" data-l10n-id="orbito-doc-restore" hidden>Restore this version</button>
      </p>
      <article id="content"></article>
      <p id="error" hidden></p>
    </main>
  </body>
</html>
